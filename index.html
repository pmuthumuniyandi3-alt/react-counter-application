    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Counter Application</title>
    <!-- Production styles for static deployment (GitHub Pages) -->
    <link rel="stylesheet" crossorigin href="./assets/index-BrAvHa4N.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Vite local development entry -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Production fallback script for GitHub Pages -->
    <script type="module">
      // When deployed statically on GitHub Pages without a dev server,
      // /src/main.jsx is not transpiled, so fallback to the production bundle.
      setTimeout(() => {
        const root = document.getElementById('root');
        if (!root || root.children.length === 0) {
          const prodScript = document.createElement('script');
          prodScript.type = 'module';
          prodScript.crossOrigin = 'anonymous';
          prodScript.src = './assets/index-CEHe_e77.js';
          document.body.appendChild(prodScript);
        }
      }, 50);
    </script>
  </body>
